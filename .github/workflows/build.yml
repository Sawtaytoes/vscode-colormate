name: Build VSIX

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  # Decide whether this change is documentation only.
  #
  # Nothing below reads markdown. There is no markdownlint, no remark, no
  # prettier over `.md` and no link check anywhere in this fleet, and Biome
  # does not format markdown. So a `.md`-only diff makes every gate below run
  # without ever opening the file that changed.
  #
  # WARNING: this job must run on EVERY event, and the gates below must be
  # turned off with `if:` rather than with `paths-ignore:` on the trigger.
  # Branch protection requires the `Build & package` check. A job that `if:` skips still
  # reports its context: GitHub records the conclusion `skipped` and counts it
  # as success, and Forgejo posts `skipped` and keeps the combined state green
  # (verified on portly-controllers#17, which merged with `CI / check
  # (pull_request)` skipped). A workflow that never STARTED posts nothing at
  # all, so a required check stays pending and the pull request can never
  # merge, with no failure to explain why.
  changes:
    runs-on: ubuntu-latest

    outputs:
      isDocsOnly: ${{ steps.detect.outputs.isDocsOnly }}

    steps:
      - uses: actions/checkout@v7
        # The full history: the diff below needs the base commit present.
        with: { fetch-depth: 0 }

      - id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          # Fail SAFE. Anything we cannot diff -- a workflow_dispatch, a tag, a
          # new branch whose `before` is all zeros, a base commit the fetch
          # missed -- runs the whole suite rather than skipping it.
          if [ -z "${BASE_SHA:-}" ] \
            || [ "${BASE_SHA}" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null
          then
            echo "No usable base commit -- running every gate."
            echo "isDocsOnly=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mergeBase="$(git merge-base "${BASE_SHA}" HEAD || echo "${BASE_SHA}")"
          changedFiles="$(git diff --name-only "${mergeBase}" HEAD)"
          printf 'Changed files:\n%s\n\n' "${changedFiles}"

          isDocsOnly=true

          if [ -z "${changedFiles}" ]
          then
            isDocsOnly=false
          elif printf '%s\n' "${changedFiles}" | grep -q '^\.changeset/'
          then
            # A changeset file is markdown, but it is a RELEASE input rather
            # than documentation. Treat it as code.
            isDocsOnly=false
          elif printf '%s\n' "${changedFiles}" | grep -qvE '^(.+\.md|LICENSE)$'
          then
            # `.mdx` deliberately does NOT match `.md$` -- it is Storybook
            # source in several repos here, and it compiles.
            isDocsOnly=false
          fi

          echo "isDocsOnly=${isDocsOnly}"
          echo "isDocsOnly=${isDocsOnly}" >> "$GITHUB_OUTPUT"

  build:
    needs: [changes]
    # Skipped, not absent: this still posts its status context.
    if: ${{ needs.changes.outputs.isDocsOnly != 'true' }}
    name: Build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read `.nvmrc` rather than pinning a literal — the pin had drifted to
      # 24 while `.nvmrc` said 26, so CI was testing a Node the repo does not
      # target. Same fix castkit took during the Charcuterie rollout.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # Run the linters as their own steps so a lint failure reads as a lint
      # failure. `vsce package` below runs them again through the
      # `vscode:prepublish` hook, which is fine — but its output buries them.
      - name: Lint (Biome)
        run: yarn lint:biome

      - name: Lint (ESLint)
        run: yarn lint:eslint

      - name: Typecheck
        run: yarn check-types

      - name: Package VSIX
        # Runs the `vscode:prepublish` hook (clean + check-types + lint + production build).
        run: npx --yes @vscode/vsce package --no-yarn

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-colormate-vsix
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Attach VSIX to GitHub Release
    needs: build
    # Only on version tags (e.g. v4.5.0). Uses the automatic GITHUB_TOKEN —
    # no external/Marketplace token. Publishing to the Marketplace stays manual.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode-colormate-vsix

      - name: Create or update the GitHub Release and attach the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.vsix --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" *.vsix --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
