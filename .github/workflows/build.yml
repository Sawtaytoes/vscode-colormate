name: Build VSIX

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

jobs:
  # The docs-only detector is SHARED: the body lives in Charcuterie and is
  # imported, not copied. Fix it there, then move the `workflows-v1` tag.
  #
  # WARNING: imported from GitHub. A reusable
  # workflow resolves on THIS host only. A cross-host import is dropped
  # SILENTLY -- the run still reports success -- so the gates below would
  # never run. Consumers must also keep turning their gates off with `if:`
  # rather than `paths-ignore:`, or a required check stays pending forever.
  changes:
    uses: Sawtaytoes/charcuterie/.github/workflows/shared-docs-only-changes.yml@workflows-v1

  # The one gate a docs-only change DOES run. It lints the decision records
  # the pull request TOUCHED, never the whole tree.
  # This repo keeps 2 decision records.
  docs:
    uses: Sawtaytoes/charcuterie/.github/workflows/shared-docs-lint.yml@workflows-v1


  build:
    needs: [changes]
    # Skipped, not absent: this still posts its status context.
    if: ${{ needs.changes.outputs.isDocsOnly != 'true' }}
    name: Build & package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Read `.nvmrc` rather than pinning a literal — the pin had drifted to
      # 24 while `.nvmrc` said 26, so CI was testing a Node the repo does not
      # target. Same fix castkit took during the Charcuterie rollout.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Install pinned pnpm
        run: npm install --global pnpm@12.9.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --store-dir ~/.local/share/pnpm/store

      # Run the linters as their own steps so a lint failure reads as a lint
      # failure. `vsce package` below runs them again through the
      # `vscode:prepublish` hook, which is fine — but its output buries them.
      - name: Lint (Biome)
        run: pnpm lint:biome

      - name: Lint (ESLint)
        run: pnpm lint:eslint

      - name: Typecheck
        run: pnpm check-types

      - name: Package VSIX
        # Runs the `vscode:prepublish` hook (clean + check-types + lint + production build).
        run: npx --yes @vscode/vsce package --no-yarn --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: vscode-colormate-vsix
          path: '*.vsix'
          if-no-files-found: error

  release:
    name: Attach VSIX to GitHub Release
    needs: build
    # Only on version tags (e.g. v4.5.0). Uses the automatic GITHUB_TOKEN —
    # no external/Marketplace token. Publishing to the Marketplace stays manual.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: vscode-colormate-vsix

      - name: Create or update the GitHub Release and attach the VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" *.vsix --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" *.vsix --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
